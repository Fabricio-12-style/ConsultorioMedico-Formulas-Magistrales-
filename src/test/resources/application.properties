# ============================================================================
#  CONFIGURACION EXCLUSIVA PARA LAS PRUEBAS (mvn test)
# ============================================================================
#  Spring Boot da prioridad a este archivo sobre src/main/resources cuando
#  corren los tests. Los ensayos con Postman NO pasan por aqui: esos usan
#  src/main/resources/application.properties, que apunta a MySQL.
#
#  POR QUE H2 Y NO MySQL:
#
#  1) Cada integrante tiene una contrasena distinta en su MySQL local. Si este
#     archivo apuntara a MySQL, el que lo suba con su contrasena rompe el
#     "mvn test" de los otros dos. Ya paso una vez. H2 no pide credenciales,
#     asi que funciona igual en las tres maquinas.
#
#  2) Las pruebas no ensucian la base real. Con MySQL, cada "mvn test" escribia
#     en formulasMagistrales y se mezclaba con los datos de Postman.
#
#  3) No hace falta tener MySQL levantado para correr las pruebas.
#
#  >>> NO EDITAR ESTE ARCHIVO PARA PONER TUS CREDENCIALES. <<<
#      Si necesitas cambiar usuario o contrasena, va en
#      src/main/resources/application.properties.
# ============================================================================

# Base de datos en memoria: se crea al arrancar los tests y muere al terminar.
# DB_CLOSE_DELAY=-1 la mantiene viva mientras dure la ejecucion.
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: Hibernate crea las tablas al inicio y las borra al final.
# Cada corrida parte de una base limpia, sin datos de la anterior.
spring.jpa.hibernate.ddl-auto=create-drop

# Sin el log de SQL, para que la salida de mvn test se lea.
spring.jpa.show-sql=false
